name: Verify and deploy production

# Copied from uma-farm's verify job and uma-quest's deploy job (both from uma-rpg's). CY2 adds the deploy job, which runs
# only on main and only once the repository variable DEPLOY_ENABLED is true.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: uma-cyberpunk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'uma-rpg' }}
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cyber-api
  API_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'uma-rpg' }}/cyber/cyber-api:${{ github.sha }}
  RUNTIME_SERVICE_ACCOUNT: cyber-api-runtime@${{ vars.GCP_PROJECT_ID || 'uma-rpg' }}.iam.gserviceaccount.com
  HOSTING_SITE: ${{ vars.HOSTING_SITE || 'uma-cyberpunk' }}
  HOSTING_URL: https://${{ vars.HOSTING_SITE || 'uma-cyberpunk' }}.web.app
  FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || 'cyber' }}
  MASTER_BUCKET: ${{ vars.MASTER_BUCKET || 'uma-platform-master-data' }}
  # The Cyberpunk universe's approved looks (D25): uma-platform's content bucket, read-only, its art/universes/cyberpunk/ only.
  LOOKS_BUCKET: ${{ vars.LOOKS_BUCKET || 'uma-platform-content' }}
  CAMPAIGN_PACK_BUCKET: uma-platform-content
  CAMPAIGN_PACK_PREFIX: campaign/cyberpunk
  # @luismlorenzana/* packages (uma-platform) on GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages
        run: pnpm lint

      - name: Run tests
        # One package at a time, as in uma-rpg: parallel Vitest suites starve the two-core runner (uma-rpg D256).
        run: pnpm test:ci

      - name: Build production artifacts
        run: pnpm build

  deploy:
    name: Deploy API and web
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: uma-cyberpunk-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build API image
        run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN -f apps/api/Dockerfile -t "${API_IMAGE}" .

      - name: Push API image
        run: docker push "${API_IMAGE}"

      - id: deploy-api
        name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.API_IMAGE }}
          labels: app=cyber
          # App-level auth (Firebase ID token + owner allowlist) guards every route but /api/health.
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=1
            --memory=512Mi
            --cpu=1
          env_vars: |
            PERSISTENCE=firestore
            FIRESTORE_DATABASE=${{ env.FIRESTORE_DATABASE }}
            MASTER_BUCKET=${{ env.MASTER_BUCKET }}
            LOOKS_BUCKET=${{ env.LOOKS_BUCKET }}
            CAMPAIGN_PACK_BUCKET=${{ env.CAMPAIGN_PACK_BUCKET }}
            CAMPAIGN_PACK_PREFIX=${{ env.CAMPAIGN_PACK_PREFIX }}
            ALLOWED_ORIGIN=${{ env.HOSTING_URL }}
            ALLOWED_EMAIL=${{ vars.ALLOWED_EMAIL }}
            BUILD_ID=${{ github.sha }}

      - name: Verify API readiness and auth guard
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "${{ steps.deploy-api.outputs.url }}/api/health" > /dev/null
          test "$(curl --silent "${{ steps.deploy-api.outputs.url }}/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')" = "${GITHUB_SHA}"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${{ steps.deploy-api.outputs.url }}/api/save")" = "401"

      - name: Build web application
        run: pnpm --filter @cyber/web build

      - name: Deploy web to Firebase Hosting
        run: pnpm dlx firebase-tools@15.22.4 deploy --only hosting:uma-cyberpunk --project="${GCP_PROJECT_ID}" --non-interactive

      - name: Verify hosted application
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "${HOSTING_URL}/" > /dev/null
          curl --silent --head "${HOSTING_URL}/" | grep -i '^cache-control: no-cache'
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${HOSTING_URL}/api/health" > /dev/null
          test "$(curl --silent "${HOSTING_URL}/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')" = "${GITHUB_SHA}"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${HOSTING_URL}/api/save")" = "401"
          curl --fail --silent --show-error "${HOSTING_URL}/campaign" > /dev/null
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${HOSTING_URL}/api/campaign/save")" = "401"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${HOSTING_URL}/api/content/campaign/preview.json")" = "401"
          # A guard against a site mix-up: uma-rpg's own site still answers.
          curl --fail --silent --show-error https://uma-rpg.web.app/api/health > /dev/null
