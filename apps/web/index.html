<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home indicator; safe areas are padded in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Keep content below iOS's opaque status bar: translucent mode gains a forced top-edge blur in iOS 27 (uma-rpg). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Uma Cyberpunk" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/uma-cyberpunk-v1-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/uma-cyberpunk-v1-touch-180.png" />
    <title>Uma Cyberpunk</title>
  </head>

  </body>
</html>
